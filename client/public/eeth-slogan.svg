<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Eeath slogan</title>
  <desc id="desc">Eeath Did It lightning slogan artwork</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#1b2a52"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd54a"/>
      <stop offset="100%" stop-color="#ff9f1a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="800" y="355" text-anchor="middle" fill="#e6ecff" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="128" font-weight="800" letter-spacing="1">
    Eeath Did It
  </text>

  <g transform="translate(1085,285) scale(1.8)" filter="url(#glow)">
    <path d="M46 0L8 66h28L18 128l62-82H50z" fill="url(#bolt)"/>
  </g>

  <text x="800" y="465" text-anchor="middle" fill="#b8c7ff" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="500" opacity="0.92">
    Quietly competent. Visibly effective.
  </text>

  <text x="800" y="810" text-anchor="middle" fill="#8fa3df" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" opacity="0.85">
    Built by Eeath ⚡
  </text>
</svg>
